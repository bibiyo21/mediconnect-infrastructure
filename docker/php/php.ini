memory_limit = 512M
expose_php = Off
display_errors = On
error_reporting = E_ALL
date.timezone = UTC
opcache.enable_cli = 0
pcov.enabled = 1
upload_max_filesize = 20M
post_max_size = 25M

; Exception traces must never carry call arguments (phone numbers, tokens, clinical text): they end up in logs and Sentry.
zend.exception_ignore_args = On
