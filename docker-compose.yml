# MediConnect local environment (LOCAL only — not a production manifest).
# Run from the mediconnect-infrastructure repo. Expects mediconnect-backend checked out
# next to it (../backend), or set BACKEND_PATH in .env.
# Default services: postgres, redis, mailpit, api, worker, scheduler.
# Optional profiles (not needed in Phase 1, keep RAM free on small machines):
#   --profile search    typesense   (Phase 3)
#   --profile realtime  reverb      (enabled once Reverb is installed)
# The S3-compatible storage emulator is added in Phase 2 with the first uploads.

name: mediconnect

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: mediconnect-php:local
  volumes:
    - ${BACKEND_PATH:-../backend}:/var/www/backend
  env_file:
    - path: ${BACKEND_PATH:-../backend}/.env
      required: false
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      DB_DATABASE: ${DB_DATABASE:-mediconnect}
      DB_OWNER_USER: ${DB_OWNER_USER:-mediconnect_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      DB_APP_USER: ${DB_APP_USER:-mediconnect_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  typesense:
    profiles: [search]
    image: typesense/typesense:30.0
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-local-dev-key}", "--enable-cors"]
    volumes: [typesensedata:/data]
    ports: ["127.0.0.1:8108:8108"]

  api:
    <<: *php
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *php
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *php
    profiles: [realtime]
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
  redisdata:
  typesensedata:
