# MediConnect local environment (LOCAL only — not a production manifest).
# Run from the mediconnect-infrastructure repo. Expects mediconnect-backend checked out
# next to it (../backend), or set BACKEND_PATH in .env.
# Default services: postgres, redis, mailpit, seaweedfs (+ storage-init), clamav, api, worker, scheduler.
# Optional profiles (not needed in Phase 1, keep RAM free on small machines):
#   --profile search    typesense   (Phase 3)
#   --profile realtime  reverb      (enabled once Reverb is installed)
# Private uploads (doctor credentials, Phase 2) go to SeaweedFS, an S3-compatible store (D-36),
# and are scanned by ClamAV before anyone can download them (D-07). ClamAV needs about
# 1-1.5 GB of RAM and downloads its virus signatures on first start (a few minutes).

name: mediconnect

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: mediconnect-php:local
  volumes:
    - ${BACKEND_PATH:-../backend}:/var/www/backend
    # Read-only docs for tests that check code against the approved documents.
    - ${DOCS_PATH:-..}/docs:/var/www/docs:ro
  # No env_file: Laravel reads backend/.env itself. Injecting it as container
  # environment would override phpunit.xml and point tests at the dev database.
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      DB_DATABASE: ${DB_DATABASE:-mediconnect}
      DB_OWNER_USER: ${DB_OWNER_USER:-mediconnect_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      DB_APP_USER: ${DB_APP_USER:-mediconnect_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  # S3-compatible private storage (D-36, amended 2026-11-19: SeaweedFS locally because
  # MinIO images are no longer pullable). Anonymous access is off: only the configured
  # identity can read or write.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"mediconnect","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mediconnect}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    volumes: [seaweeddata:/data]
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Creates the private bucket once.
  storage-init:
    image: chrislusf/seaweedfs:3.97
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      S3_BUCKET: ${S3_BUCKET:-mediconnect-private}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
    restart: "no"

  clamav:
    image: clamav/clamav-debian:1.4  # the -debian build publishes arm64 as well as amd64
    volumes: [clamavdata:/var/lib/clamav]
    # No published port: only the backend containers talk to clamd (3310) on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10

  typesense:
    profiles: [search]
    image: typesense/typesense:30.0
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-local-dev-key}", "--enable-cors"]
    volumes: [typesensedata:/data]
    ports: ["127.0.0.1:8108:8108"]

  api:
    <<: *php
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *php
    # All queues in priority order, from the backend's config/queue.php (queues:work).
    command: ["php", "artisan", "queues:work"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *php
    profiles: [realtime]
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
  redisdata:
  typesensedata:
  seaweeddata:
  clamavdata:
